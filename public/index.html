<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbound Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand">Outbound Intelligence</span>
    <nav id="nav" class="nav hidden" aria-label="Main">
      <button class="navtab" type="button" data-view="dashboard">Dashboard</button>
      <button class="navtab" type="button" data-view="runs">Runs</button>
      <button class="navtab" type="button" data-view="profile">Seller profile</button>
    </nav>
    <div id="topRight" class="top-right hidden">
      <div id="meters" class="meters"></div>
      <span id="gmailStatus" class="gmail-status"></span>
      <button id="logout" class="btn ghost sm" type="button">Log out</button>
    </div>
  </div>
</header>

<div id="toasts" class="toasts" aria-live="polite"></div>

<main class="page">
  <section id="loginBox" class="login hidden">
    <h1>Research a prospect, then write the email that fits.</h1>
    <p class="lead">Log in to add prospects and review drafts before anything is sent.</p>
    <form id="loginForm" class="card">
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary block" type="submit">Log in</button>
    </form>
  </section>

  <section id="viewDashboard" class="view hidden">
    <div class="page-head">
      <div><h1>Prospects</h1><p class="sub">Research a person, check the facts, and save a reviewed draft to Gmail.</p></div>
      <div class="head-actions">
        <button id="btnImport" class="btn" type="button">Import list</button>
        <button id="btnAdd" class="btn primary" type="button">Add prospect</button>
      </div>
    </div>
    <div id="tiles" class="tiles"></div>
    <div class="card flush">
      <div class="table-tools">
        <input id="filter" type="search" placeholder="Search by name, company or email" aria-label="Search prospects">
        <span id="count" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th class="w-prospect">Prospect</th><th>Company</th><th>Status</th><th>Next step</th><th>Added</th><th class="w-more"><span class="sr">More</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty hidden"></div>
    </div>
    <div class="card">
      <h2>Recent runs</h2>
      <div id="recentRuns"></div>
    </div>
  </section>

  <section id="viewRuns" class="view hidden"></section>
  <section id="viewProfile" class="view hidden"></section>
</main>

<div id="backdrop" class="backdrop hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Prospect review">
  <div id="dHead" class="drawer-head"></div>
  <div id="dScroll" class="drawer-scroll"></div>
  <div id="actionbar" class="actionbar"></div>
</aside>

<dialog id="addDlg" class="dlg wide"></dialog>
<dialog id="editDlg" class="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
